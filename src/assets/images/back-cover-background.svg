<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 257" width="182mm" height="257mm">
  <!--
    裏表紙（表 4）のプレースホルダー背景．執筆者が差し替える前提で置く．
    差し替えは本ファイルの置換，またはテーマ CSS にある裏表紙の
    背景画像変数の上書きで行う（docs/spec/cover.md を参照）．
    配色は palette.css 第 1 層の既定値に対応させている
    （#2f5b8c / #b0c4de / #f0f4f8）．
    右上は ISDN バーコードの規定位置（docs/spec/isdn.md）のため，
    天側 60mm ほどは無地を保つ．
  -->
  <rect width="182" height="257" fill="#f0f4f8"/>

  <!-- 地側の帯と罫線（文字情報の背面．可読性を保つ淡色にとどめる） -->
  <rect y="205.8" width="182" height="1.2" fill="#2f5b8c" opacity="0.5"/>
  <rect y="207" width="182" height="50" fill="#b0c4de" opacity="0.35"/>

  <!-- 右下の角落とし（ドッグイヤー）モチーフ -->
  <path d="M182 257 L182 227 L152 257 Z" fill="#2f5b8c" opacity="0.3"/>
</svg>

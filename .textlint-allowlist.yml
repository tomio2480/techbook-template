# textlint の指摘から除外するパターン（Issue #104）．
# 中央テンプレ tomio2480/github-workflows の composite action が本ファイルを読み，
# runtime config の filters.allowlist へ注入する．スキーマは
# textlint-filter-rule-allowlist に従う（allow は文字列または /regex/flags）．
#
# 原稿側では直せない誤検出だけを列挙する．文体や表記ゆれの指摘を止める目的で使わない．
# .textlintignore でファイルごと外す案は採らない．奥付・数式の章にも地の文があり，
# そこは検査を残したいためである．

allow:
  # 奥付の発行履歴（例: 2026年08月06日 初版第一刷発行）．
  # docs/spec/colophon.md が定める「YYYY年MM月DD日 第N版第N刷発行」の形式は
  # 奥付の慣例に合わせた表記であり，半角スペースの挿入や句点の追加は spec と衝突する．
  # ja-space-between-half-and-full-width・ja-no-space-between-full-width・
  # max-kanji-continuous-len・ja-no-mixed-period の 4 ルールが同じ 1 行へ並ぶため，
  # 行ごと除外する．
  - "/^\\d{4}年\\d{2}月\\d{2}日 .+発行$/m"

  # 表示数式（$$ … $$）．textlint の Markdown パーサは数式を認識せず地の文として
  # 文長を数えるため，80 字を超える数式が sentence-length に掛かる．
  # インライン数式（$…$）を巻き込まないよう $$ で囲んだ範囲だけを除外する．
  - "/\\$\\$[\\s\\S]*?\\$\\$/m"

  # 字種そのものを話題にする鍵括弧（「、」「。」）．
  # CLAUDE.md や docs/notes/ では旧字種を引用して規約や経緯を書くため，
  # .prh-extra.yml の読点規則が地の文と同じように指摘してしまう．
  # 鍵括弧で 1 字だけ囲んだ形を除外し，区切りとして使われた「、」の検出は残す．
  # 句点側は現時点で ja-no-mixed-period が発火しないが，
  # 文末が「。」で終わる引用に備えて同じ 1 本で対にしておく．
  - "/「[、。]」/"

  # 図表キャプション（例: 表 1. 設定ファイルの扱い）．
  # CLAUDE.md はキャプションを体言止めとし句点を付けないと定めるが，
  # ja-no-mixed-period はキャプションと地の文を区別できず指摘を出す．
  # 「表」「図」＋半角スペース＋数字＋"." ＋半角スペースを必須にして，
  # 「表記ゆれ」のような地の文に一致しないようにする．
  # 奥付の発行履歴と同じく行ごと除外になるため，キャプション内の読点や
  # 表記ゆれの検査も止まる．短い体言止めであり，実害は小さいと判断した．
  - "/^(図|表) \\d+\\. .+$/m"

allowRules: []

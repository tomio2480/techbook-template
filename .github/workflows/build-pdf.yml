name: Build PDF

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# 連続 push では古い実行を打ち切る．
# ただしタグ実行（Release）は打ち切らない．
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # スクリプトのユニットテスト．PDF を組まないため軽量である．
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 従来は npm run build の冒頭でこれらが走っていた．
      # PDF 生成を opt-in にしたため，検査だけを切り出して常に実行する．
      - name: Check repository data
        run: |
          npm run check:errata
          npm run check:isdn
          npm run check:preface
          npm run check:index

  # PDF の生成は明示的に指示したときだけ行う．
  # 手動実行するか，PR へ build-pdf ラベルを付ける．
  build-pdf:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build-pdf'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # dist/book.pdf へのタグ付け後処理（@opendataloader/pdf）が Java 11 以上を要求する
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: npm ci

      - name: Build PDF
        run: npm run build

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: dist/*.pdf
          retention-days: 7

  # Release は v* タグを push したときだけ作成する．
  # workflow_dispatch をタグの ref で実行しても走らないよう push に限定する．
  # Release アセットは Actions のストレージ枠を消費しない．
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # main の履歴と照合するため全履歴を取得する．
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # main へマージしていないコミットへタグを打つと，
      # 未公開の内容が版として公開されてしまう．
      # 版番号の検証だけでは防げない（feature ブランチも version は据え置きのため）．
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            exit 1
          fi

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # dist/book.pdf へのタグ付け後処理（@opendataloader/pdf）が Java 11 以上を要求する
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: npm ci

      # タグ名と package.json の version が食い違うと，
      # 誤った版番号で古い内容を公開してしまう．
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v${tag_version} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Build PDF
        run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*.pdf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

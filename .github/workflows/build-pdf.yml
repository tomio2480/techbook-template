name: Build PDF

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# 連続 push では古い実行を打ち切る．
# ただしタグ実行（Release）は打ち切らない．
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # スクリプトのユニットテスト．PDF を組まないため軽量である．
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 従来は npm run build の冒頭でこれらが走っていた．
      # PDF 生成を opt-in にしたため，検査だけを切り出して常に実行する．
      - name: Check repository data
        run: |
          npm run check:errata
          npm run check:isdn
          npm run check:preface
          npm run check:index

  # PDF の生成は明示的に指示したときだけ行う．
  # 手動実行するか，PR へ build-pdf ラベルを付ける．
  build-pdf:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build-pdf'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PDF
        run: npm run build

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: dist/*.pdf
          retention-days: 7

      # veraPDF による PDF/UA-1 検証（Issue #189）．
      # 合否ではビルドを止めない（正式準拠はスコープ外）．
      # 終了コード 0=準拠・1=非準拠は成功，2 以上は実行エラーとして失敗させる．
      # イメージはダイジェストでピン留めする（v1.30.2 相当）．更新は手動で行う．
      - name: Run veraPDF validation
        run: |
          exit_code=0
          docker run --rm -v "${PWD}/dist:/data" \
            verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb \
            --flavour ua1 --format json /data/book.pdf \
            > verapdf-report.json || exit_code=$?
          if [ "${exit_code}" -ge 2 ]; then
            echo "::error::veraPDF failed to run (exit code ${exit_code})." >&2
            exit "${exit_code}"
          fi

      # レポートは要約より先に保存する．要約の失敗時も調査材料を残すためである．
      - name: Upload veraPDF report
        uses: actions/upload-artifact@v7
        with:
          name: verapdf-report
          path: verapdf-report.json
          retention-days: 7

      - name: Write veraPDF summary
        run: node scripts/summarize-verapdf.mjs verapdf-report.json >> "${GITHUB_STEP_SUMMARY}"

  # Release は v* タグを push したときだけ作成する．
  # workflow_dispatch をタグの ref で実行しても走らないよう push に限定する．
  # Release アセットは Actions のストレージ枠を消費しない．
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # main の履歴と照合するため全履歴を取得する．
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # main へマージしていないコミットへタグを打つと，
      # 未公開の内容が版として公開されてしまう．
      # 版番号の検証だけでは防げない（feature ブランチも version は据え置きのため）．
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            exit 1
          fi

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # タグ名と package.json の version が食い違うと，
      # 誤った版番号で古い内容を公開してしまう．
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v${tag_version} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Build PDF
        run: npm run build

      # veraPDF による PDF/UA-1 検証（Issue #189）．build-pdf ジョブと同じ扱い．
      - name: Run veraPDF validation
        run: |
          exit_code=0
          docker run --rm -v "${PWD}/dist:/data" \
            verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb \
            --flavour ua1 --format json /data/book.pdf \
            > verapdf-report.json || exit_code=$?
          if [ "${exit_code}" -ge 2 ]; then
            echo "::error::veraPDF failed to run (exit code ${exit_code})." >&2
            exit "${exit_code}"
          fi

      # レポートは要約より先に保存する．要約の失敗時も調査材料を残すためである．
      - name: Upload veraPDF report
        uses: actions/upload-artifact@v7
        with:
          name: verapdf-report
          path: verapdf-report.json
          retention-days: 7

      - name: Write veraPDF summary
        run: node scripts/summarize-verapdf.mjs verapdf-report.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*.pdf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

title: "書籍タイトル"
subtitle: "サブタイトル"
author: "著者名"
version: "1.0.0"
lang: ja
date: "2025-01-01"

# 奥付の著者紹介（99-colophon.md の {{authors}} マーカーへ流し込まれる）
# name 以外は任意．bio は 140 文字程度を目安にする．link は 1 つだけ書く
authors:
  - name: "著者名"
    sns: "@example"
    bio: "著者の紹介文をここに書く．経歴や活動内容などを 140 文字程度でまとめる．"
    link:
      title: "Web サイト"
      url: "https://example.com/"

# 公開正誤表ページの URL（99-colophon.md の {{errata}} マーカーへ流し込まれる）
# errata/errata.yml の slug と一致するページを指すこと（check:errata が突合する）
errata:
  url: "https://example.github.io/errata/books/example-book/"

# 奥付の著作権表記（99-colophon.md の {{copyright}} マーカーへ流し込まれる）
# year は初版発行年．4 桁の数値，または "YYYY-YYYY" 形式の文字列
# holder 省略時は上部の author を使う．notice 省略時は既定の禁止文言を使う
copyright:
  year: 2026
  # holder: "著者名"
  # notice: "本書の一部または全部を，著作権者の許諾なく複製・転載・改変・公衆送信することを禁じます．"

chapters:
  - src/chapters/00-preface.md
  - src/chapters/01-introduction.md

# 紙入稿用 PDF（npm run build:print）の面付け設定
# page_multiple は綴じの単位．総ページ数をこの倍数へ揃える（既定 4）
# 入稿先の指定に合わせて 2 や 8 へ変更する
print:
  page_multiple: 4
  # 区分をどちらの面から始めるか．recto は奇数ページ（開いて右），
  # verso は偶数ページ（開いて左）．キーは原稿ファイル名に含まれる文字列で，
  # 前から順に照合する．面の指定はここが単一の出所であり，
  # テーマ CSS 側の書き換えは要らない
  section_start:
    "00-preface": recto
    "toc": verso
    "98-afterword": recto
    "99-colophon": verso
  # 章扉（chapter-opening）を持つ原稿を始める面
  chapter_start: recto
  # 面付けの調整ページを寄せる先．指定した原稿の直前へまとめて入れる
  # 寄せ先に面の指定があるときは，その面を保つため偶数ページ分だけを前へ入れ，
  # 端数の 1 ページは裏表紙の直前（奥付の後ろ）へ残る
  # 空文字にすると，調整ページをすべて裏表紙の直前へまとめる
  filler_before: "99-colophon"
  # 章扉（chapter-opening）を持たない区分にも小口のつめを付けるときの指定．
  # キーは原稿ファイル名に含まれる文字列，値はつめへ刷る番号の文字．
  # タイトルは原稿の h1 から取り，番号は扉があれば扉を優先する．
  # 本テンプレートの付録は扉を持つため既につめの対象であり，指定は要らない．
  # 扉を持たない付録を書く場合へ向けて，記入例を残す
  # section_tabs:
  #   "97-appendix": "X"

typesetting:
  page_size: A5
  font_size: 10pt
  line_height: 1.8

output:
  filename: "book-{version}.pdf"
  include_toc: true

title: "書籍タイトル"
subtitle: "サブタイトル"
author: "著者名"
version: "1.0.0"
lang: ja
date: "2025-01-01"

# 奥付の著者紹介（99-colophon.md の {{authors}} マーカーへ流し込まれる）
# name 以外は任意．bio は 140 文字程度を目安にする．link は 1 つだけ書く
authors:
  - name: "著者名"
    sns: "@example"
    bio: "著者の紹介文をここに書く。経歴や活動内容などを 140 文字程度でまとめる。"
    link:
      title: "Web サイト"
      url: "https://example.com/"

# 公開正誤表ページの URL（99-colophon.md の {{errata}} マーカーへ流し込まれる）
# errata/errata.yml の slug と一致するページを指すこと（check:errata が突合する）
errata:
  url: "https://example.github.io/errata/books/example-book/"

# 奥付の著作権表記（99-colophon.md の {{copyright}} マーカーへ流し込まれる）
# year は初版発行年．4 桁の数値，または "YYYY-YYYY" 形式の文字列
# holder 省略時は上部の author を使う．notice 省略時は既定の禁止文言を使う
copyright:
  year: 2026
  # holder: "著者名"
  # notice: "本書の一部または全部を、著作権者の許諾なく複製・転載・改変・公衆送信することを禁じます。"

chapters:
  - src/chapters/00-preface.md
  - src/chapters/01-introduction.md

typesetting:
  page_size: A5
  font_size: 10pt
  line_height: 1.8

output:
  filename: "book-{version}.pdf"
  include_toc: true

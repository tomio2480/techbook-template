# ISDN（国際標準同人誌番号）の申請情報と発行情報
#
# application: 申請フォーム（https://isdn.jp/mail/registrar/）へ転記する下書き．
#   書籍の完成後，このファイルを見ながらフォームへ入力して申請する．
#   申請時の集め直しを防ぐための保管場所である．うち c_code・price・circle は
#   裏表紙の情報ブロック（バーコード脇のコード行・発行者表記）にも使う．
# issued: 運営からメールで受け取った発行結果．ビルドが誌面へ流し込む．
#
# 注意（安全のための約束）:
# - 申請フォームの管理用パスワードは絶対にこのファイルへ書かない．
# - 氏名・メールアドレスなどの個人情報も既定では書かない．
#   公開リポジトリではコミット履歴に残り続けることを踏まえて判断する．

application:
  category: "オリジナル"           # 大分類: オリジナル / パロディ
  form: "同人誌"                   # 形態: 同人誌 / グッズ / 音楽 / ソフト など
  rating: "区別なし"               # レーティング: 区別なし / 15禁 / 18禁
  region: "日本"                   # 発行地域
  title: "書籍タイトル"            # config/book.yaml の title と揃える
  title_kana: "しょせきたいとる"   # 作品タイトルのよみがな（ひらがな）
  circle: "サークル名"
  circle_kana: "さーくるめい"      # サークル名のよみがな（ひらがな）
  issue_date: ""                   # 発行日: イベント初頒布日・通販開始日・入稿日のいずれか
  # ここから任意項目．書かない場合は空のままでよい
  c_code: "3055"                   # C コード 4 桁（販売対象・発行形態・内容）．サンプル値
  price: "1000"                    # イベント価格（円）．サンプル値
  genre: ""                        # ジャンル
  format: "B5"                     # 体裁（判型）
  pages: ""                        # ページ数
  authors:
    - "著者名"
  link: ""                         # 作品・サークルの紹介 URL

issued:
  # 発行された番号を「ISDN278-4-XXXXXX-XX-X」の形で書く（ハイフンは通知どおり）．
  # 初期値はテンプレートのサンプル番号である．このまま出版しないこと
  # （check:isdn が差し替え忘れを警告する）
  number: "ISDN278-4-876543-21-9"
  # 運営から受領したバーコード画像の配置先．受領したらこのパスへ置く．
  # 初期状態はダミーのバーコード画像であり，実際の読み取りはできない
  barcode: "src/assets/isdn-barcode.png"
